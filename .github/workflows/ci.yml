name: CI

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@stable
            with:
              targets: wasm32-unknown-unknown
          - uses: Swatinem/rust-cache@v2
          - run: cargo test
          - run: cargo build --release --target wasm32-unknown-unknown

    deploy:
        needs: test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@stable
            with:
              targets: wasm32-unknown-unknown
          - uses: Swatinem/rust-cache@v2
          - name: Build worker
            run: cargo install worker-build && worker-build --release
          # Install celld and set its node/bucket credentials as repository secrets
          # as described in https://celld.dev/docs, then deploy the built shim.
          - name: Deploy with celld
            run: celld deploy
