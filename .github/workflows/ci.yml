name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    deploy:
        permissions:
          contents: write
          id-token: write
          deployments: write
        timeout-minutes: 3.5
        runs-on: ["ubuntu-latest"]
        steps:
          - name: "🏨 Checkout"
            uses: actions/checkout@v7
    
          - name: "🦕 Setup Deno"
            uses: denoland/setup-deno@v2
            with:
              deno-version: v2.x

          - name: "🥬 Deploy App"
            run: |
                deno deploy \
                  --token="${{ secrets.DENO_DEPLOY_TOKEN }}" \
                  --app="fuel-prices-api" \
                  --prod \
                  --json \
                  --non-interactive

