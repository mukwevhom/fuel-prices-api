name: CI

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@stable
            with:
              targets: wasm32-unknown-unknown
          - uses: Swatinem/rust-cache@v2
          - run: cargo test
          - run: cargo build --release --target wasm32-unknown-unknown

    deploy:
        needs: test
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
          - uses: actions/checkout@v4
          - uses: dtolnay/rust-toolchain@stable
            with:
              targets: wasm32-unknown-unknown
          - uses: Swatinem/rust-cache@v2
          - name: Build worker
            run: cargo install worker-build && worker-build --release
          - name: Install esbuild and celld
            run: |
              npm install -g esbuild
              curl -fsSL https://celld.dev/install.sh | sh
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          - name: Deploy with celld
            env:
              AWS_ACCESS_KEY_ID: ${{ secrets.CELLD_AWS_ACCESS_KEY_ID }}
              AWS_SECRET_ACCESS_KEY: ${{ secrets.CELLD_AWS_SECRET_ACCESS_KEY }}
              AWS_REGION: auto
              S3_ENDPOINT: ${{ secrets.CELLD_S3_ENDPOINT }}
              CELLD_BUCKET: ${{ secrets.CELLD_BUCKET }}
            run: |
              celld deploy . \
                --bucket "$CELLD_BUCKET" \
                --endpoint "$S3_ENDPOINT" \
                --region "$AWS_REGION"
